# LibreLane backend (FastAPI `app/`) + runner imaj build profilleri.
#
# Önkoşullar:
#   docker network create librelane-network
#   sudo mkdir -p /var/lib/librelane/jobs
#
# Ollama (host'ta native kurulu):
#   Backend `OLLAMA_BASE_URL=http://host.docker.internal:11434` ile host Ollama'ya gider.
#   Servis kapalıysa `OLLAMA_HOST_START_COMMAND` host PID 1 namespace'inde çalıştırılır;
#   bunun için aşağıdaki `pid: host`, `privileged` ve dbus mount gerekir.
#   Host'ta: systemctl enable --now ollama ve `ollama pull <model>`.
#
# İsteğe bağlı compose içi Ollama:
#   docker compose --profile bundled-ollama up -d
#   ve OLLAMA_BASE_URL=http://ollama:11434 verin.
#
# Runner imajları (job başına ephemeral container):
#   docker compose --profile build-runner build
# OpenLane1 runner amd64 imajı; ARM host'ta pull/build sırasında --platform=linux/amd64 kullanın.

services:
  ollama:
    profiles: ["bundled-ollama"]
    image: ollama/ollama:latest
    container_name: librelane-ollama
    restart: unless-stopped
    networks:
      - librelane-network
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: librelane/backend:latest
    container_name: librelane-backend
    restart: unless-stopped
    pid: host
    privileged: true
    networks:
      - librelane-network
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      DB_PATH: /data/jobs.db
      WORKSPACE_ROOT: /workspace
      JOBS_HOST_DIR: /var/lib/librelane/jobs
      JOBS_ARTIFACTS_PREFIX: _jobs
      RUNNER_IMAGE_BASIC: ${RUNNER_IMAGE_BASIC:-librelane/runner:basic}
      RUNNER_IMAGE_OPENLANE: ${RUNNER_IMAGE_OPENLANE:-efabless/openlane:ci2504-dev-amd64}
      RUNNER_NETWORK: librelane-network
      RUNNER_TIMEOUT_SECONDS: ${RUNNER_TIMEOUT_SECONDS:-0}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-4}
      ENABLE_OPENLANE_TOOLS: ${ENABLE_OPENLANE_TOOLS:-true}
      OPENLANE_PDK_HOST_PATH: ${OPENLANE_PDK_HOST_PATH:-}
      OPENLANE_PDK_MOUNT_PATH: ${OPENLANE_PDK_MOUNT_PATH:-/openlane/pdk}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:26b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_AUTO_START: ${OLLAMA_AUTO_START:-true}
      OLLAMA_HOST_START_COMMAND: ${OLLAMA_HOST_START_COMMAND:-nsenter -t 1 -m -u -n -i systemctl start ollama}
      OLLAMA_CONTAINER_NAME: ${OLLAMA_CONTAINER_NAME:-}
      OLLAMA_READY_TIMEOUT_SECONDS: ${OLLAMA_READY_TIMEOUT_SECONDS:-60}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - ./workspace:/workspace
      - /var/lib/librelane/jobs:/var/lib/librelane/jobs
      - librelane-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  runner-image-build:
    profiles: ["build-runner"]
    build:
      context: ./runner
      dockerfile: Dockerfile
    image: librelane/runner:basic
    container_name: librelane-runner-builder
    command: ["true"]
    restart: "no"

  openlane-runner-image-build:
    profiles: ["build-runner"]
    build:
      context: ./runner
      dockerfile: Dockerfile.openlane
    image: librelane/runner:openlane
    container_name: librelane-openlane-runner-builder
    command: ["true"]
    restart: "no"

volumes:
  librelane-data:
  ollama-data:

networks:
  librelane-network:
    external: true
