# LibreLane backend (FastAPI `app/`) + runner imaj build profilleri.
#
# Önkoşullar:
#   docker network create librelane-network
#   sudo mkdir -p /var/lib/librelane/jobs
#
# Ollama yalnizca host'ta calisir (compose icinde ollama servisi yok).
#   Host: ollama pull gemma4:26b
#   Ollama'nin container'dan erisilebilmesi icin host'ta dinleme adresi acik olmali
#   (or. OLLAMA_HOST=0.0.0.0:11434 veya systemd override).
#   Backend: OLLAMA_BASE_URL=http://host.docker.internal:11434
#   OLLAMA_AUTO_START=true iken backend host'ta `ollama run <OLLAMA_MODEL>` komutunu
#   nsenter ile arka planda calistirir.
#
# Runner imaji (job basina ephemeral container):
#   docker pull efabless/openlane:ci2504-dev-amd64
# Opsiyonel yerel runner build profili (build-runner); runtime efabless/openlane.

services:
  backend:
    image: ghcr.io/ismailcanuslu/etu_libralane_backend:sha-4003df0
    container_name: librelane-backend
    restart: unless-stopped
    pid: host
    privileged: true
    networks:
      - librelane-network
    ports:
      - "8001:8001"
    environment:
      DB_PATH: /data/jobs.db
      WORKSPACE_ROOT: /workspace
      JOBS_HOST_DIR: /var/lib/librelane/jobs
      JOBS_WORKDIR_IN_RUNNER: /work
      JOBS_ARTIFACTS_PREFIX: _jobs
      RUNNER_IMAGE_BASIC: efabless/openlane:ci2504-dev-amd64
      RUNNER_IMAGE_OPENLANE: efabless/openlane:ci2504-dev-amd64
      RUNNER_NETWORK: librelane-network
      RUNNER_TIMEOUT_SECONDS: "0"
      MAX_CONCURRENT_JOBS: "4"
      ENABLE_OPENLANE_TOOLS: "true"
      OPENLANE_PDK_HOST_PATH: ""
      OPENLANE_PDK_MOUNT_PATH: /openlane/pdk
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma4:26b
      OLLAMA_TIMEOUT_SECONDS: "300"
      OLLAMA_AUTO_START: "true"
      OLLAMA_HOST_START_COMMAND: ""
      OLLAMA_CONTAINER_NAME: ""
      OLLAMA_READY_TIMEOUT_SECONDS: "60"
      ENABLE_HOST_TERMINAL: "true"
      HOST_TERMINAL_USE_NSENTER: "true"
      HOST_TERMINAL_SHELL: /bin/bash
      MAX_HOST_TERMINAL_SESSIONS: "4"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - ./workspace:/workspace
      - /var/lib/librelane/jobs:/var/lib/librelane/jobs
      - librelane-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  runner-image-build:
    profiles: [ "build-runner" ]
    build:
      context: ./runner
      dockerfile: Dockerfile
    image: librelane/runner:basic
    container_name: librelane-runner-builder
    command: [ "true" ]
    restart: "no"

  openlane-runner-image-build:
    profiles: [ "build-runner" ]
    build:
      context: ./runner
      dockerfile: Dockerfile.openlane
    image: librelane/runner:openlane
    container_name: librelane-openlane-runner-builder
    command: [ "true" ]
    restart: "no"

volumes:
  librelane-data:

networks:
  librelane-network:
    external: true
